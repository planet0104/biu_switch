[package]
name = "biu_switch"
version = "1.0.0"
authors = ["Jia Ye <planet0104@gmail.com>"]
edition = "2021"

[dependencies]
embedded-hal = "1.0.0"
cortex-m = "0.7"
cortex-m-rt = "0.7"
# Panic behaviour, see https://crates.io/keywords/panic-impl for alternatives
panic-semihosting = "0.6.0"
cortex-m-semihosting = "0.5.0"

stm32f0xx-hal = { version = "0.18", features = ["stm32f030", "stm32f030x8", "device-selected"]}
embedded-storage = "0.3.0"

[profile.dev]
#debug = true
lto = true
#opt-level = "s"

[profile.release]
lto = true
strip = true
opt-level = 's'
panic = 'abort'
codegen-units = 1